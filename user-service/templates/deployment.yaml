apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Chart.Name }}-app
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app:  {{ .Chart.Name }}-app
  template:
    metadata:
      labels:
        app:  {{ .Chart.Name }}-app
    spec:
      containers:
        - name: user-service-container
          image: "{{ .Values.image.repository}}/{{ .Values.image.name }}:{{ .Values.image.tag}}"
          imagePullPolicy: {{ .Values.image.pullPolicy}}
          ports:
            - containerPort: {{ .Values.containerPort }}
          env:
            - name: CONFIG_SERVICE_URL
              value: config-server-app-service.config.svc.cluster.local
            - name: USER_MYSQL_URL
              value: {{ .Values.springEnv.userMysqlUrl}}
            - name: PROFILE
              value: prod
            - name: KAFKAURL
              value: kraft-cluster-kafka-bootstrap.kafka.svc.cluster.local
            - name: NOTIFICATION_SERVICE_URL
              value: notification-service-app
            - name: DOMAIN_NAME
              value: i12a404.p.ssafy.io
            - name: USER_SERVICE_REDIS_NAME
              value: kiwi-redis-user
            - name: USER_SERVICE_REDIS_PORT
              value: "6379"