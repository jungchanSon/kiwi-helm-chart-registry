apiVersion: v1
kind: ConfigMap
metadata:
  name: logstash-pipelines
  labels:
    task: logging
    k8s-app: logstash
data:
  pipelines.yml: |
    - pipeline.id: log_user_pipeline
      path.config: "/usr/share/logstash/pipeline/log_user.conf"

    - pipeline.id: log_store_pipeline
      path.config: "/usr/share/logstash/pipeline/log_store.conf"

    - pipeline.id: log_order_pipeline
      path.config: "/usr/share/logstash/pipeline/log_order.conf"

